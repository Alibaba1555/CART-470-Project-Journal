<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connection line demo</title>
<style>*{box-sizing:border-box}body{margin:0;background:#faf8f1;color:#34313d;font:15px system-ui,sans-serif}header{padding:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select{font:inherit;padding:8px 12px;border:1px solid #b8afcf;border-radius:5px;background:white;color:#51449b}button:disabled{opacity:.4}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #927dc5;outline-offset:2px}label{display:flex;gap:8px;align-items:center}p{margin:0;padding:0 16px 12px;font-size:14px}svg{display:block;width:100%;height:330px;background:white;border-block:1px solid #dedbd3;touch-action:none;cursor:crosshair}footer{padding:12px 16px;font-size:12px;color:#68616f}input{accent-color:#5e4fb1}</style>
<header><button id="draw">Draw line</button><label>Line <select id="choice"><option value="">None</option></select></label><label>Curve <input id="curve" type="range" min="-160" max="160" value="0" disabled></label><button id="del" disabled>Delete</button><button id="undo" disabled>Undo</button></header>
<p id="status" role="status">Choose Draw line, then click a start and end point.</p>
<svg id="canvas" viewBox="0 0 800 330" preserveAspectRatio="xMidYMid meet" aria-label="Line drawing area. Click two points to create a line."><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#5e4fb1" stroke-width="1.2"/></marker></defs><g id="lines"></g></svg>
<footer>Small interaction demo. Changes stay here for this visit and do not update the group project.</footer>
<script>
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';let lines=[],selected=null,start=null,drawing=false,next=1,history=[];
function snapshot(){history.push(JSON.stringify({lines,selected}));if(history.length>30)history.shift()}
function node(tag,attrs){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e}
function render(){ $('lines').replaceChildren();for(const l of lines){const dx=l.b.x-l.a.x,dy=l.b.y-l.a.y,len=Math.hypot(dx,dy)||1;const c={x:(l.a.x+l.b.x)/2-dy/len*l.curve,y:(l.a.y+l.b.y)/2+dx/len*l.curve};const path=node('path',{d:`M${l.a.x},${l.a.y} Q${c.x},${c.y} ${l.b.x},${l.b.y}`,fill:'none',stroke:l.id===selected?'#5e4fb1':'#8e879b','stroke-width':l.id===selected?3:2,'marker-end':'url(#arrow)'});$('lines').append(path)}if(start)$('lines').append(node('circle',{cx:start.x,cy:start.y,r:5,fill:'#5e4fb1'}));$('choice').replaceChildren(new Option('None',''));for(const l of lines)$('choice').add(new Option('Line '+l.id,l.id));$('choice').value=selected??'';const l=lines.find(l=>l.id===selected);$('curve').disabled=!l;$('del').disabled=!l;$('curve').value=l?.curve??0;$('undo').disabled=!history.length;$('draw').textContent=drawing?'Cancel drawing':'Draw line';}
$('draw').onclick=()=>{drawing=!drawing;start=null;$('status').textContent=drawing?'Click a start point, then an end point.':'Choose a line to adjust or delete it.';render()};
$('canvas').onclick=e=>{if(!drawing)return;const p=$('canvas').createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform($('canvas').getScreenCTM().inverse());if(q.x<0||q.x>800||q.y<0||q.y>330)return;if(!start){start={x:q.x,y:q.y};$('status').textContent='Now click an end point.'}else{if(Math.hypot(q.x-start.x,q.y-start.y)<10){$('status').textContent='Choose an end point a little farther away.';return}snapshot();selected=next++;lines.push({id:selected,a:start,b:{x:q.x,y:q.y},curve:0});start=null;drawing=false;$('status').textContent='Line created. Move the Curve slider to bend it.'}render()};
$('choice').onchange=()=>{selected=Number($('choice').value)||null;render()};let adjusting=false;$('curve').oninput=()=>{const l=lines.find(l=>l.id===selected);if(!l)return;if(!adjusting){snapshot();adjusting=true}l.curve=Number($('curve').value);render()};$('curve').onchange=()=>adjusting=false;
$('del').onclick=()=>{snapshot();lines=lines.filter(l=>l.id!==selected);selected=lines.at(-1)?.id??null;$('status').textContent='Line deleted.';render()};$('undo').onclick=()=>{if(!history.length)return;const s=JSON.parse(history.pop());lines=s.lines;selected=s.selected;start=null;drawing=false;adjusting=false;$('status').textContent='Last change undone.';render()};render();
</script></html>
